services:
  - type: web
    name: vera-merchant-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false  # prompts you to enter the value in the Render dashboard
      - key: BOT_URL
        value: https://vera-merchant-ai.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"
